<style id="css">
/* Layout: sticky pill nav, split hero with offset photo, then airy sections on a bright mint-white ground. Yellow is the one loud accent (name highlighter + photo block). */
:root{
  --h:174;
  --bg:#F5F9FA; --surface:#FFFFFF; --surface2:#EAF2F4; --ink:#0F1F2E; --muted:#4F6378; --line:#D8E3E9;
  --accent:hsl(var(--h) 80% 30%); --accent-soft:hsl(var(--h) 65% 92%); --accent-ink:#FFFFFF;
  --sun:#FFD23F; --on-sun:#14202B; --danger:#B3261E;
  --f-display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
  --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1620; --surface:#122230; --surface2:#182C3C; --ink:#E9F1F6; --muted:#9DB2C5; --line:#233A4C;
  --accent:hsl(var(--h) 65% 62%); --accent-soft:hsl(var(--h) 35% 17%); --accent-ink:#06211E; --danger:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1620; --surface:#122230; --surface2:#182C3C; --ink:#E9F1F6; --muted:#9DB2C5; --line:#233A4C;
  --accent:hsl(var(--h) 65% 62%); --accent-soft:hsl(var(--h) 35% 17%); --accent-ink:#06211E; --danger:#FF8A80; color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.02em;color:var(--muted)}

/* nav */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 8px 7px 8px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:999px}
.logo{display:flex;align-items:center;gap:10px;font:700 .95rem var(--f-display);text-decoration:none;min-width:0}
.mark{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 .85rem var(--f-display)}
.logo span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.links{display:flex;gap:2px;margin-inline:auto}
.links a{padding:7px 12px;border-radius:999px;text-decoration:none;font-size:.88rem;font-weight:500;color:var(--muted)}
.links a:hover{background:var(--surface2);color:var(--ink)}
.tools{display:flex;align-items:center;gap:6px}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .78rem var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(15,31,46,.14)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 22px;font:600 .95rem var(--f-body);cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.sm{padding:8px 16px;font-size:.84rem}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
@media (max-width:860px){.links{display:none}.tools{margin-left:auto}}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:48px;align-items:center;padding-block:56px 40px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);font:600 .82rem var(--f-body);padding:6px 14px;border-radius:999px}
.hero h1{font-size:clamp(2.7rem,8.5vw,5.6rem);font-weight:800;line-height:.98;margin-top:20px;letter-spacing:-.035em}
.hl{background:linear-gradient(transparent 60%,var(--sun) 60% 90%,transparent 90%);-webkit-box-decoration-break:clone;box-decoration-break:clone;padding:0 .08em}
.tagline{font:600 clamp(1.15rem,2.4vw,1.5rem)/1.3 var(--f-display);margin-top:20px;max-width:26ch}
.intro{color:var(--muted);margin-top:14px;max-width:56ch}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.stats{display:flex;flex-wrap:wrap;gap:18px 34px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line)}
.stat{min-width:0;max-width:150px}
.stat .v{font:700 2rem/1 var(--f-display);color:var(--accent);display:block;letter-spacing:-.03em}
.stat .l{display:block;font-size:.8rem;color:var(--muted);margin-top:6px;line-height:1.35}
.photo{position:relative;width:100%;max-width:380px;justify-self:center;aspect-ratio:4/5;padding:0 18px 18px 0}
.photo::before{content:"";position:absolute;inset:18px 0 0 18px;background:var(--sun);border-radius:34px}
.frame{position:relative;height:100%;border-radius:34px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;border:1px solid var(--line)}
.frame img{width:100%;height:100%;object-fit:cover;display:block}
.mono-big{font:800 clamp(4rem,12vw,6.5rem) var(--f-display);color:var(--accent);letter-spacing:-.04em}
.photobtn{display:none;position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 .8rem var(--f-body);cursor:pointer;box-shadow:0 2px 10px rgba(15,31,46,.2);white-space:nowrap}
body.editing .photobtn{display:block}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:36px;padding-block:36px 24px}.photo{order:-1;max-width:280px;justify-self:start}}

/* sections */
section{padding-block:56px 8px;scroll-margin-top:84px}
.sh{display:flex;align-items:center;gap:16px;font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:700;margin-bottom:28px}
.sh::after{content:"";flex:1;height:1px;background:var(--line)}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:40px}
.two>*{min-width:0}
.about p+p{margin-top:16px}
.about p{max-width:62ch}
dl.facts{margin:0;display:grid;gap:0;align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px 20px}
.fact{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.fact:last-child{border-bottom:0}
.fact dt{color:var(--muted);font-size:.84rem}
.fact dd{margin:0;font-weight:600;text-align:right;min-width:0}
@media (max-width:860px){.two{grid-template-columns:1fr;gap:28px}}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;min-width:0}
.card h3{font-size:1.25rem;font-weight:700;line-height:1.25}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0 14px}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.card li{position:relative;padding-left:20px;display:block}
.card li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:8px;border-radius:50%;background:var(--sun)}
.card li .t{display:inline}
.tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font:600 .74rem var(--f-mono);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.card p{color:var(--muted)}

.rows{list-style:none;margin:0;padding:0}
.rows li{position:relative;display:flex;justify-content:space-between;align-items:baseline;gap:6px 18px;flex-wrap:wrap;padding:16px 36px 16px 0;border-bottom:1px solid var(--line)}
.rows li .t{font-weight:600;min-width:0}
.rows li .mono{text-align:right}
.acts{display:grid;gap:22px;align-content:start}
.act{position:relative;padding:0 36px 0 18px;border-left:3px solid var(--sun)}
.act h3{font-size:1.1rem;font-weight:700}
.act .mono{display:block;margin:2px 0 6px}
.act p{color:var(--muted)}
h3.sub{font-size:1.1rem;font-weight:700;margin-bottom:6px;color:var(--muted);font-family:var(--f-body);letter-spacing:0}

.pills{display:flex;flex-wrap:wrap;gap:10px;list-style:none;margin:0 0 36px;padding:0}
.pills li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:.92rem}
.pills li .x{top:-8px;right:-6px}
.interests{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
.interest{position:relative;background:var(--surface2);border-radius:20px;padding:22px 36px 22px 22px}
.interest h3{font-size:1.1rem;margin-bottom:6px}
.interest p{color:var(--muted)}

.contact{background:var(--accent);color:var(--accent-ink);border-radius:30px;padding:clamp(24px,5vw,48px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px 48px}
.contact>*{min-width:0}
.contact h2{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:800;line-height:1.05}
.contact .lead{margin-top:14px;opacity:.9;max-width:36ch}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);position:relative}
.crow:last-child{border-bottom:0}
.crow .k{flex:none;width:92px;font:500 .74rem var(--f-mono);opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.crow .val{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600;user-select:all}
.crow .lk{flex:none;color:inherit;text-decoration:none;font-weight:700}
.copy{flex:none;border:1.5px solid color-mix(in srgb,var(--accent-ink) 55%,transparent);background:transparent;color:inherit;border-radius:999px;font:600 .75rem var(--f-body);padding:5px 12px;cursor:pointer}
.copy:hover{background:color-mix(in srgb,var(--accent-ink) 14%,transparent)}
.crow .x{background:var(--surface);color:var(--danger)}
@media (max-width:860px){.contact{grid-template-columns:1fr}}
footer{padding-block:40px 0;color:var(--muted);font-size:.85rem;text-align:center}

/* editing */
.x{display:none;position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--surface2);color:var(--danger);font:700 1rem/1 var(--f-body);cursor:pointer;place-items:center;padding:0}
body.editing .x{display:grid}
.card li .x{top:-2px;right:0;width:22px;height:22px;font-size:.9rem}
.add{display:none;margin-top:14px;border:1.5px dashed var(--line);background:transparent;color:var(--accent);border-radius:999px;font:600 .84rem var(--f-body);padding:8px 16px;cursor:pointer}
.add:hover{border-color:var(--accent)}
body.editing .add{display:inline-block}
body.editing [data-p]{border-radius:6px;outline:1.5px dashed transparent;outline-offset:2px;cursor:text;transition:outline-color .15s,background-color .15s}
body.editing [data-p]:hover{outline-color:color-mix(in srgb,var(--accent) 55%,transparent)}
body.editing [data-p]:focus{outline:2px solid var(--accent);background:var(--accent-soft)}
body.editing .contact [data-p]:focus{background:color-mix(in srgb,var(--accent-ink) 18%,transparent);outline-color:var(--accent-ink)}
.dock{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:max-content;max-width:calc(100% - 32px);
  display:none;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 14px;background:var(--ink);color:var(--bg);border-radius:26px;padding:10px 14px;box-shadow:0 10px 36px rgba(15,31,46,.35)}
body.editing .dock{display:flex}
.dock .btn{background:var(--sun);color:var(--on-sun)}
.dock .btn.ghost{background:transparent;color:var(--bg);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--bg) 45%,transparent)}
.sw{display:flex;gap:6px;align-items:center}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--bg);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--bg)}
#status{font-size:.8rem;opacity:.85;min-width:0}
.dock label.btn{cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

var HUES=[[174,'Teal'],[218,'Blue'],[8,'Coral'],[140,'Green']];

function get(o,p){return p.split('.').reduce(function(a,k){return a==null?a:a[k]},o)}
function set(o,p,v){var ks=p.split('.'),l=ks.pop();var t=ks.reduce(function(a,k){return a[k]},o);t[l]=v}
function D(){return S[lang]}
function u(){return U[lang]}
function ed(path,tag,cls){return '<'+tag+(cls?' class="'+cls+'"':'')+' data-p="'+path+'">'+esc(get(D(),path))+'</'+tag+'>'}
function x(path){return '<button class="x" type="button" data-del="'+path+'" aria-label="'+esc(u().del)+'">×</button>'}
function addBtn(path,key){return '<button class="add" type="button" data-add="'+path+'" data-key="'+key+'">+ '+esc(u().add[key])+'</button>'}
function initials(n){var w=String(n).split(/\s+/).filter(function(s){return /^\p{L}/u.test(s)});if(!w.length)return 'P';var a=w.slice(-2).map(function(s){return Array.from(s)[0].toUpperCase()});return a.join('')}

function render(){
  var d=D(),t=u();
  document.documentElement.lang=lang;
  document.documentElement.style.setProperty('--h',S.accent);
  document.body.classList.toggle('editing',editing);
  var h='';
  h+='<div class="wrap">';
  h+='<header class="bar"><a class="logo" href="#top"><span class="mark" id="mk">'+esc(initials(d.name))+'</span><span class="n" id="nm">'+esc(d.name)+'</span></a>';
  h+='<nav class="links" aria-label="Menu">'+t.nav.map(function(n){return '<a href="#'+n[0]+'">'+esc(n[1])+'</a>'}).join('')+'</nav>';
  h+='<div class="tools"><div class="seg" role="group" aria-label="Language"><button type="button" data-lang="vi" aria-pressed="'+(lang==='vi')+'">VI</button><button type="button" data-lang="en" aria-pressed="'+(lang==='en')+'">EN</button></div>';
  h+='<button class="btn sm" type="button" id="editBtn">'+esc(editing?t.done:t.edit)+'</button></div></header>';

  h+='<div id="top" class="hero"><div>'+ed('role','span','pill')+'<h1><span class="hl" data-p="name">'+esc(d.name)+'</span></h1>'+ed('tagline','p','tagline')+ed('intro','p','intro');
  h+='<div class="cta"><a class="btn" href="#ach">'+esc(t.seeAch)+'</a><a class="btn ghost" href="#contact">'+esc(t.talk)+'</a></div>';
  h+='<div class="stats">'+d.stats.map(function(s,i){return '<div class="stat">'+ed('stats.'+i+'.v','span','v')+ed('stats.'+i+'.l','span','l')+'</div>'}).join('')+'</div></div>';
  h+='<div class="photo"><div class="frame">'+(S.photo?'<img src="'+esc(S.photo)+'" alt="'+esc(d.name)+'">':'<span class="mono-big" id="mono">'+esc(initials(d.name))+'</span>')+'<label class="photobtn" for="photoIn">'+esc(t.photo)+'</label></div></div></div>';

  h+='<section id="about"><h2 class="sh">'+esc(t.h.about)+'</h2><div class="two"><div class="about">'+d.about.map(function(p,i){return ed('about.'+i,'p')}).join('')+'</div>';
  h+='<dl class="facts">'+d.facts.map(function(f,i){return '<div class="fact"><dt>'+ed('facts.'+i+'.k','span')+'</dt><dd>'+ed('facts.'+i+'.v','span')+'</dd></div>'}).join('')+'</dl></div></section>';

  h+='<section id="edu"><h2 class="sh">'+esc(t.h.edu)+'</h2><div class="cards">'+d.education.map(function(e,i){
    return '<article class="card">'+x('education.'+i)+'<h3>'+ed('education.'+i+'.org','span')+'</h3><div class="meta">'+ed('education.'+i+'.role','span','mono')+ed('education.'+i+'.time','span','mono')+'</div><ul>'+
      e.bullets.map(function(b,j){return '<li>'+x('education.'+i+'.bullets.'+j)+ed('education.'+i+'.bullets.'+j,'span','t')+'</li>'}).join('')+'</ul>'+addBtn('education.'+i+'.bullets','bullets')+'</article>'}).join('')+'</div>'+addBtn('education','education')+'</section>';

  h+='<section id="ach"><h2 class="sh">'+esc(t.h.ach)+'</h2><div class="two" style="grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)"><div><ul class="rows">'+d.awards.map(function(a,i){
    return '<li>'+x('awards.'+i)+ed('awards.'+i+'.title','span','t')+ed('awards.'+i+'.meta','span','mono')+'</li>'}).join('')+'</ul>'+addBtn('awards','awards')+'</div>';
  h+='<div><h3 class="sub">'+esc(t.h.act)+'</h3><div class="acts">'+d.activities.map(function(a,i){
    return '<div class="act">'+x('activities.'+i)+ed('activities.'+i+'.title','h3')+ed('activities.'+i+'.meta','span','mono')+ed('activities.'+i+'.text','p')+'</div>'}).join('')+'</div>'+addBtn('activities','activities')+'</div></div></section>';

  h+='<section id="proj"><h2 class="sh">'+esc(t.h.proj)+'</h2><div class="cards">'+d.projects.map(function(p,i){
    return '<article class="card">'+x('projects.'+i)+ed('projects.'+i+'.tag','span','tag')+ed('projects.'+i+'.title','h3')+'<div style="height:8px"></div>'+ed('projects.'+i+'.text','p')+'</article>'}).join('')+'</div>'+addBtn('projects','projects')+'</section>';

  h+='<section id="skills"><h2 class="sh">'+esc(t.h.skills)+'</h2><ul class="pills">'+d.skills.map(function(s,i){return '<li>'+x('skills.'+i)+ed('skills.'+i,'span')+'</li>'}).join('')+'</ul>'+addBtn('skills','skills');
  h+='<h3 class="sub" style="margin-top:36px">'+esc(t.h.interests)+'</h3><div class="interests">'+d.interests.map(function(s,i){return '<div class="interest">'+x('interests.'+i)+ed('interests.'+i+'.title','h3')+ed('interests.'+i+'.text','p')+'</div>'}).join('')+'</div>'+addBtn('interests','interests')+'</section>';

  var c=d.contact;
  h+='<section id="contact"><div class="contact"><div>'+ed('contact.title','h2')+ed('contact.text','p','lead')+'</div><div>';
  [['email',t.email],['phone',t.phone],['city',t.city]].forEach(function(r){
    h+='<div class="crow"><span class="k">'+esc(r[1])+'</span>'+ed('contact.'+r[0],'span','val')+(r[0]!=='city'?'<button class="copy" type="button" data-copy="contact.'+r[0]+'">'+esc(t.copy)+'</button>':'')+'</div>'});
  h+=c.links.map(function(l,i){var ok=/^https?:\/\//i.test(l.url);return '<div class="crow">'+x('contact.links.'+i)+ed('contact.links.'+i+'.label','span','k')+ed('contact.links.'+i+'.url','span','val')+(ok?'<a class="lk" href="'+esc(l.url)+'" target="_blank" rel="noopener" aria-label="'+esc(t.open)+'">↗</a>':'')+'</div>'}).join('');
  h+=addBtn('contact.links','links')+'</div></div></section>';
  h+='<footer>'+esc(d.name)+' · '+new Date().getFullYear()+'</footer></div>';

  h+='<div class="dock" role="region" aria-label="'+esc(t.edit)+'"><div class="sw" role="group" aria-label="'+esc(t.color)+'">'+HUES.map(function(k){return '<button type="button" data-hue="'+k[0]+'" aria-label="'+k[1]+'" aria-pressed="'+(S.accent===k[0])+'" style="background:hsl('+k[0]+' 75% 45%)"></button>'}).join('')+'</div>';
  h+='<input class="sr" type="file" id="photoIn" accept="image/*"><span id="status" role="status"></span><button class="btn sm" type="button" id="saveBtn">'+esc(t.save)+'</button></div>';
  $('#app').innerHTML=h;
  if(editing)document.querySelectorAll('[data-p]').forEach(function(el){el.setAttribute('contenteditable','true')});
  status(dirty?t.unsaved:'');
}
function status(m){var s=$('#status');if(s)s.textContent=m||''}
function markDirty(){if(!dirty){dirty=true}status(u().unsaved)}

var app=$('#app');
app.addEventListener('input',function(e){
  var el=e.target.closest&&e.target.closest('[data-p]');if(!el)return;
  var v=el.textContent;
  if(el.dataset.p==='name'){S.vi.name=lang==='vi'?v:S.vi.name;S.en.name=lang==='en'?v:S.en.name;var n=$('#nm'),m=$('#mk'),mo=$('#mono');if(n)n.textContent=v;if(m)m.textContent=initials(v);if(mo)mo.textContent=initials(v);
    var other=lang==='vi'?'en':'vi';if(!S[other].nameEdited){S[other].name=v}S[lang].nameEdited=true}
  else set(D(),el.dataset.p,v);
  markDirty();
});
app.addEventListener('keydown',function(e){
  var el=e.target.closest&&e.target.closest('[data-p]');
  if(el&&e.key==='Enter'){e.preventDefault();el.blur()}
});
app.addEventListener('paste',function(e){
  var el=e.target.closest&&e.target.closest('[data-p]');if(!el)return;
  e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s*\n\s*/g,' ');
  document.execCommand('insertText',false,t);
});
app.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='editBtn'){editing=!editing;render();return}
  if(b.id==='saveBtn'){save();return}
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('pf-lang',lang)}catch(er){}render();return}
  if(b.dataset.hue){S.accent=+b.dataset.hue;markDirty();render();return}
  if(b.dataset.del){var ks=b.dataset.del.split('.'),i=+ks.pop();var arr=get(D(),ks.join('.'));arr.splice(i,1);markDirty();render();return}
  if(b.dataset.add){var arr2=get(D(),b.dataset.add);var tp=u().tpl[b.dataset.key];arr2.push(JSON.parse(JSON.stringify(tp)));markDirty();render();return}
  if(b.dataset.copy){var txt=get(D(),b.dataset.copy);var old=b.textContent;
    var done=function(){b.textContent=u().copied;setTimeout(function(){b.textContent=old},1400)};
    var fb=function(){var r=document.createRange();r.selectNodeContents(b.parentNode.querySelector('.val'));var s=getSelection();s.removeAllRanges();s.addRange(r)};
    try{navigator.clipboard.writeText(txt).then(done,fb)}catch(er){fb()}return}
});
app.addEventListener('change',function(e){
  if(e.target.id!=='photoIn'||!e.target.files[0])return;
  var f=e.target.files[0],rd=new FileReader();
  rd.onload=function(){var im=new Image();im.onload=function(){
    var z=480,c=document.createElement('canvas');c.width=z;c.height=Math.round(z*1.25);
    var cx=c.getContext('2d'),r=Math.max(c.width/im.width,c.height/im.height),w=im.width*r,h=im.height*r;
    cx.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);
    S.photo=c.toDataURL('image/jpeg',.82);markDirty();render()};im.src=rd.result};
  rd.readAsDataURL(f);
});

var RESET=':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}';
function buildDoc(payload){
  var j=JSON.stringify(payload).replace(/</g,'\\u003c'),cl='</'+'script>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
   '<title>Portfolio cá nhân</title><meta name="claude:viewport-fit-sides" content="cover">'+
   '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">'+
   '<style id="css">'+$('#css').textContent+'</style><div id="app"></div><script type="application/json" id="seed">'+j+cl+'<script id="js">'+$('#js').textContent+cl+'</body></html>';
}
async function save(){
  if(saving)return;saving=true;var t=u(),btn=$('#saveBtn');if(btn)btn.disabled=true;status(t.saving);
  var payload={savedAt:Date.now(),accent:S.accent,photo:S.photo,vi:S.vi,en:S.en};
  try{sessionStorage.setItem('pf-draft',JSON.stringify(payload))}catch(e){}
  try{
    var art=await claude.use('artifact');
    if(!art){status(t.nosave)}
    else{
      try{await art.publish({'content.json':JSON.stringify(payload)});S.savedAt=payload.savedAt;dirty=false;try{sessionStorage.removeItem('pf-draft')}catch(e){}status(t.saved)}
      catch(err){
        var c=err&&err.code;
        if(c==='capability_disabled'||c==='capability_removed'||c==='read_only_path'){
          try{await art.publish(buildDoc(payload));dirty=false;try{sessionStorage.removeItem('pf-draft')}catch(e){}status(t.saved)}
          catch(e2){status(e2&&(e2.code==='not_writer'||e2.code==='not_granted')?t.ro:t.fail)}
        }
        else if(c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='consent_required'){status(t.ro)}
        else if(c==='conflict'){}
        else status(t.fail);
      }
    }
  }catch(e){status(t.nosave)}
  saving=false;btn=$('#saveBtn');if(btn)btn.disabled=false;
}

render();
try{fetch('content.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
  if(j&&j.vi&&j.en&&(j.savedAt||0)>(S.savedAt||0)&&!dirty&&!editing){S=j;render()}}).catch(function(){})}catch(e){}
})();
</script>
